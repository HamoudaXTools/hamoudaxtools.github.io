<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Notes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100%;
            background: #000;
            color: white;
            overflow: hidden;
        }

        .notes-app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Header */
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1c1e;
        }

        .header h1 { font-size: 18px; font-weight: 600; }

        .header-btn {
            background: none;
            border: none;
            color: #ff9f0a;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }

        /* Search */
        .search-bar {
            padding: 10px 20px;
            background: #1c1c1e;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            background: #2c2c2e;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }

        .search-input::placeholder { color: #8e8e93; }

        /* Notes List */
        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
        }

        .note-item {
            padding: 15px 0;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }

        .note-item:active { background: #1c1c1e; }

        .note-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .note-preview {
            font-size: 14px;
            color: #8e8e93;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-date {
            font-size: 14px;
            color: #8e8e93;
        }

        /* Editor View */
        .editor-view {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: none;
            flex-direction: column;
        }

        .editor-view.active { display: flex; }

        .editor-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1c1e;
        }

        .btn-back {
            background: none;
            border: none;
            color: #ff9f0a;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .editor-actions {
            display: flex;
            gap: 20px;
        }

        .editor-actions button {
            background: none;
            border: none;
            color: #ff9f0a;
            font-size: 20px;
            cursor: pointer;
        }

        .editor-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .editor-title {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 15px;
            outline: none;
        }

        .editor-body {
            width: 100%;
            height: calc(100% - 50px);
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #1c1c1e;
            border-top: 1px solid #333;
        }

        .toolbar button {
            background: none;
            border: none;
            color: #ff9f0a;
            font-size: 22px;
            cursor: pointer;
            padding: 8px 15px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #8e8e93;
        }

        .empty-state span {
            font-size: 60px;
            display: block;
            margin-bottom: 15px;
        }

        /* Footer */
        .footer {
            padding: 15px;
            text-align: center;
            color: #8e8e93;
            font-size: 14px;
            background: #1c1c1e;
        }
    </style>
</head>
<body>
    <div class="notes-app">
        <!-- Notes List View -->
        <div class="list-view" id="list-view">
            <div class="header">
                <button class="header-btn">📁</button>
                <h1>Notes</h1>
                <button class="header-btn" id="btn-new">✏️</button>
            </div>

            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Search" id="search-input">
            </div>

            <div class="notes-list" id="notes-list">
                <!-- Notes will be rendered here -->
            </div>

            <div class="footer" id="footer">0 Notes</div>
        </div>

        <!-- Editor View -->
        <div class="editor-view" id="editor-view">
            <div class="editor-header">
                <button class="btn-back" id="btn-back">← Notes</button>
                <div class="editor-actions">
                    <button id="btn-share">📤</button>
                    <button id="btn-delete">🗑️</button>
                </div>
            </div>

            <div class="editor-content">
                <input type="text" class="editor-title" placeholder="Title" id="note-title">
                <textarea class="editor-body" placeholder="Start typing..." id="note-body"></textarea>
            </div>

            <div class="toolbar">
                <button>📎</button>
                <button>📷</button>
                <button>✅</button>
                <button>Aa</button>
            </div>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('ios-notes') || '[]');
        let currentNoteId = null;

        const listView = document.getElementById('list-view');
        const editorView = document.getElementById('editor-view');
        const notesList = document.getElementById('notes-list');
        const footer = document.getElementById('footer');
        const noteTitle = document.getElementById('note-title');
        const noteBody = document.getElementById('note-body');
        const searchInput = document.getElementById('search-input');

        function saveNotes() {
            localStorage.setItem('ios-notes', JSON.stringify(notes));
        }

        function formatDate(date) {
            const d = new Date(date);
            const now = new Date();
            if (d.toDateString() === now.toDateString()) {
                return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            }
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function renderNotes(filter = '') {
            const filtered = notes.filter(n => 
                n.title.toLowerCase().includes(filter.toLowerCase()) ||
                n.body.toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                notesList.innerHTML = `
                    <div class="empty-state">
                        <span>📝</span>
                        <p>${filter ? 'No results found' : 'No notes yet'}</p>
                        <p>Tap ✏️ to create a new note</p>
                    </div>
                `;
            } else {
                notesList.innerHTML = filtered.map(note => `
                    <div class="note-item" data-id="${note.id}">
                        <div class="note-title">${note.title || 'New Note'}</div>
                        <div class="note-preview">
                            <span class="note-date">${formatDate(note.updated)}</span>
                            ${note.body.substring(0, 50) || 'No additional text'}
                        </div>
                    </div>
                `).join('');

                notesList.querySelectorAll('.note-item').forEach(item => {
                    item.addEventListener('click', () => openNote(item.dataset.id));
                });
            }

            footer.textContent = `${notes.length} Note${notes.length !== 1 ? 's' : ''}`;
        }

        function openNote(id) {
            const note = notes.find(n => n.id === id);
            if (note) {
                currentNoteId = id;
                noteTitle.value = note.title;
                noteBody.value = note.body;
            } else {
                currentNoteId = Date.now().toString();
                noteTitle.value = '';
                noteBody.value = '';
            }
            listView.style.display = 'none';
            editorView.classList.add('active');
            noteTitle.focus();
        }

        function closeEditor() {
            // Save note
            if (noteTitle.value || noteBody.value) {
                const existingIndex = notes.findIndex(n => n.id === currentNoteId);
                const noteData = {
                    id: currentNoteId,
                    title: noteTitle.value,
                    body: noteBody.value,
                    updated: Date.now()
                };

                if (existingIndex >= 0) {
                    notes[existingIndex] = noteData;
                } else {
                    notes.unshift(noteData);
                }
                saveNotes();
            }

            listView.style.display = 'block';
            editorView.classList.remove('active');
            currentNoteId = null;
            renderNotes();
        }

        function deleteNote() {
            if (currentNoteId && confirm('Delete this note?')) {
                notes = notes.filter(n => n.id !== currentNoteId);
                saveNotes();
                closeEditor();
            }
        }

        // Event Listeners
        document.getElementById('btn-new').addEventListener('click', () => openNote(null));
        document.getElementById('btn-back').addEventListener('click', closeEditor);
        document.getElementById('btn-delete').addEventListener('click', deleteNote);
        searchInput.addEventListener('input', (e) => renderNotes(e.target.value));

        // Add sample notes if empty
        if (notes.length === 0) {
            notes = [
                { id: '1', title: 'Welcome to Notes', body: 'This is your first note! Tap to edit or create new notes.', updated: Date.now() },
                { id: '2', title: 'Shopping List', body: '• Milk\n• Eggs\n• Bread\n• Coffee', updated: Date.now() - 86400000 },
                { id: '3', title: 'Ideas', body: 'Build an iOS simulator\nCreate weather app\nAdd more features', updated: Date.now() - 172800000 }
            ];
            saveNotes();
        }

        renderNotes();
    </script>
</body>
</html>
